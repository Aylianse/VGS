# Initial HTTP config — use this before SSL is installed.
# Copy to: /etc/nginx/sites-available/vitaglow
# Then: sudo ln -sf /etc/nginx/sites-available/vitaglow /etc/nginx/sites-enabled/
# Replace YOUR_DOMAIN with your real domain (e.g. vitaglowproducts.com)
#
# After DNS points here, run:
#   certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN
# Certbot will add HTTPS and redirect automatically.
#
# Or, after certs exist, use deploy/nginx-vitaglow-ssl.conf instead.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
