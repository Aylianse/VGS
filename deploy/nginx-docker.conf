# nginx reverse proxy for Docker Compose (HTTP).
# Proxies port 80 → vitaglow:3000
#
# For HTTPS on the VPS, either:
#   - Run Certbot on the host and proxy to localhost:80, or
#   - Terminate SSL in Hostinger hPanel / a separate nginx on the host

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    location / {
        proxy_pass http://vitaglow:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
